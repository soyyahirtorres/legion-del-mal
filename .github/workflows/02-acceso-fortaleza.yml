        runs-on: ubuntu-latest

        steps:
            - name: El agente llega a la fortaleza
              run: |
                echo "El agente ${{github.actor}} llega a la fortaleza"
                echo "Buscar los archivos de la legion"
                ls -la
                echo ""
                echo "x, pero que paso= no hay nada"
            - name: Desbloquear boveda
              uses: actions/checkout@v4
            - name: Ver planes
              run: |
                echo "Buscar los archivos de la legion"
                ls -la
                echo "Encontrado los planes de la legion"
                echo "planes"  
                ls planes/
                echo "villanos"
                ls miembros/
                echo "Inteligencia"
                ls inteligencia/