# This is a basic workflow to help you get started with Actions

name: Comunicador de la legion del mal

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      villano: 
        description: '¿Que villano envia el mensaje?'
        required: true
        type: choice
        options:
          - lex luthor
          - Joker
          - Darkseid
          - Brainiac

      mensaje: 
        description: 'Mensaje para el consejo'
        required: true
        default: 'La mision ha sido cumplida'

      prioridad: 
        description: 'Nivel de prioridad del mensaje'
        required: true
        type: choice
        options:
          - alta
          - media
          - baja
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  transmitir-mensaje:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Imprimir variabes
        run: |
          echo "Inputs del workflow"
          echo "El villano que envia el mensaje es: ${{ inputs.villano }}"
          echo "El mensaje es: ${{inputs.mensaje }}"
          echo "La prioridad del mensaje es: ${{ inputs.prioridad }}"

